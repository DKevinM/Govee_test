name: Run Govee Light Script

on:
  workflow_dispatch:  # allows manual run
  schedule:
    - cron: '20,40 * * * *'  # every 20 / 40 minutes
    
jobs:
  govee:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests


      - name: Test Govee API (force RED)
        run: |
          curl -X PUT "https://developer-api.govee.com/v1/devices/control" \
          -H "Govee-API-Key: ${{ secrets.GOVEE_API_KEY }}" \
          -H "Content-Type: application/json" \
          -d '{
            "device": "98:17:3C:1E:B1:CC",
            "model": "H610A",
            "cmd": {
              "name": "color",
              "value": {"r":255,"g":0,"b":0}
            }
          }'

      - name: Run govee.py
        env:
          GOVEE_API_KEY: ${{ secrets.GOVEE_API_KEY }}
        run: python govee.py
